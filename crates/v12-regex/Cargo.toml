[package]
name = "v12-regex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# `utf16` enables regress's `&[u16]` input path (`find_from_utf16`/`find_from_ucs2`),
# the primary input encoding for this wrapper. Everything else stays default.
regress = { workspace = true, features = ["utf16"] }
