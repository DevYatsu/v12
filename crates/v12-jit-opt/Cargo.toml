[package]
name = "v12-jit-opt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
v12-bytecode.workspace = true
v12-heap.workspace = true
v12-interp.workspace = true
# ADR-006: shared types live in `v12-codegen`; the opt tier depends on the
# shared core for types. `v12-jit-baseline` remains a normal dependency as
# the fallback tier — the optimizer delegates non-speculative functions to
# the template JIT — but it no longer supplies opt's public types.
v12-codegen.workspace = true
v12-jit-baseline.workspace = true
cranelift-frontend = { workspace = true, optional = true }
cranelift-codegen = { workspace = true, optional = true }
cranelift-module = { workspace = true, optional = true }
cranelift-native = { workspace = true, optional = true }
target-lexicon = { version = "0.13", optional = true }

[dev-dependencies]
proptest = "1"

[features]
# Interpreter-only builds stay first-class: the JIT is a cargo feature (plan §4).
default = ["jit"]
jit = [
  "dep:cranelift-frontend",
  "dep:cranelift-codegen",
  "dep:cranelift-module",
  "dep:cranelift-native",
  "dep:target-lexicon",
]
