[package]
name = "v12-jit-baseline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
v12-bytecode.workspace = true
v12-heap.workspace = true
v12-interp.workspace = true
# Shared types live in `v12-codegen`. The baseline tier depends on the
# shared core, *not* on the opt tier.
v12-codegen.workspace = true
cranelift-frontend = { workspace = true, optional = true }
cranelift-codegen = { workspace = true, optional = true }
cranelift-module = { workspace = true, optional = true }
cranelift-native = { workspace = true, optional = true }
cranelift-jit = { workspace = true, optional = true }
target-lexicon = { version = "0.13", optional = true }

[features]
# Interpreter-only builds stay first-class: the JIT is a cargo feature (plan §4).
default = ["jit"]
jit = [
  "dep:cranelift-frontend",
  "dep:cranelift-codegen",
  "dep:cranelift-module",
  "dep:cranelift-native",
  "dep:cranelift-jit",
  "dep:target-lexicon",
]
