[package]
name = "v12-interp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Enables `Interp::from_source`, the source-text convenience
# constructor that pulls in `v12-bccompiler` for tests / power users.
# Off by default so production embedders can build a small binary.
default = ["compiler"]
compiler = ["dep:v12-bccompiler"]

[dependencies]
v12-bytecode.workspace = true
v12-heap.workspace = true
v12-native.workspace = true
rustc-hash.workspace = true
# The interpreter runs `v12_bytecode::Program`s, not compiler
# products. The front-end (`v12-bccompiler` / `oxc_*` / `lasso`) is no
# longer a runtime dependency of the interpreter; embedders that want
# source-text eval go through `v12-engine` (or `v12-api`).
v12-bccompiler = { workspace = true, optional = true }

[dev-dependencies]
test-support.workspace = true
# Property tests for the per-opcode type-feedback lattice (see feedback.rs).
proptest = "1"

[lints]
workspace = true
