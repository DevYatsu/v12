# cargo-deny configuration.
#
# Accepted licenses are the ones appearing in the dependency tree today.
# Each non-standard entry carries the reason it was accepted, so future
# audits can distinguish deliberate choices from oversights.

[graph]
all-features = true

[licenses]
version = 2
allow = [
    # Our own license arms and the ecosystem default.
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",

    # Permissive licenses used across the tree.
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "CC0-1.0",

    # Deliberate copyleft acceptances:
    # - LGPL-3.0-only: malachite (BigInt). Weak copyleft; obligations are
    #   notices + library-source availability + relinkability of distributed
    #   binaries. Accepted because nothing else matches its arithmetic
    #   performance in pure Rust.
    "LGPL-3.0-only",

    # - Apache-2.0 OR GPL-2.0-only (self_cell): dual choice resolves to the
    #   Apache arm; recorded so the resolver's pick is visible here.
    "Apache-2.0 OR GPL-2.0-only",
]

# Sources whose crates bypass the license check above (none expected).
[[licenses.clarify]]
name = "self_cell"
expression = "Apache-2.0"
reason = "Dual Apache-2.0 OR GPL-2.0-only; v12 selects the Apache arm."
