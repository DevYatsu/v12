[package]
name = "test262-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Test262 conformance runner for v12 — executes tests via v12-engine and reports TAP/JSON"
publish = false

[dependencies]
v12-engine.workspace = true
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
glob = "0.3"
indicatif = { version = "0.18", features = ["rayon"] }

[[bin]]
name = "test262-runner"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
