[workspace]
resolver = "3"
members = ["crates/*", "conformance/harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = ""

# Design-boundary guardrails. Every workspace member opts into the
# unwrap/expect/panic lints — `[lints] workspace = true` for the crates, and
# conformance/harness spells the same three out under `[lints.clippy]` because
# it keeps a stricter `unsafe_code = "forbid"` override there. `unsafe_code` is
# deny (not forbid) elsewhere so the audited site can keep its scoped
# `#[allow(unsafe_code)]`: the `HostClosure` raw-pointer handle
# (v12-heap/src/function.rs).
#
# The unwrap/expect/panic lints are warn-level here, and are not yet a gate:
# scripts/check-architecture.sh runs clippy report-only, because
# `cargo clippy --workspace --all-features` emits 301 warnings (293 lints + 8
# per-crate summary lines) and `-D warnings` already fails. Promoting them to
# errors requires BOTH a zero-warning count AND the audited-site allowlist
# (scripts/unwrap-allowlist.txt, enforced by scripts/unwrap-lint.sh, task
# W0.3) — otherwise `-D warnings` turns all 566 existing sites red at once.
# See docs/architecture-maintainability-plan.md §4.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
# Front end (ADR-1): weekly 0.x releases with breaking changes — pin exact,
# upgrade deliberately.
oxc_parser = "=0.147.0"
oxc_ast = "=0.147.0"
oxc_semantic = "=0.147.0"
oxc_span = "=0.147.0"

# JIT backend (ADR-3).
cranelift-frontend = "0.135"
cranelift-codegen = "0.135"

# ECMA-262 RegExp engine.
regress = "0.12"

# Identifier interning. Consumed by v12-bccompiler; the CLI used to pin it
# without a single use site (removed in W4.1).
lasso = "=0.7.3"

# Enum derive helpers (FromRepr for NativeId / Kind discriminants).
strum = { version = "0.28", features = ["derive"] }

# Hash tables / hashing: FxHashMap/FxHashSet (hashbrown-backed, rustc's
# FxHasher) for the integer-keyed maps in v12-heap.
rustc-hash = "2"

# Inline small-vector storage for `JsObject` descriptor slots
# (`properties` / `property_keys`): zero heap alloc for the common
# small-object case, spills to the heap automatically past the inline cap.
smallvec = "1"

# Internal crates.
v12-bytecode = { path = "crates/v12-bytecode" }
v12-heap = { path = "crates/v12-heap" }
v12-native = { path = "crates/v12-native" }
v12-bccompiler = { path = "crates/v12-bccompiler" }
v12-interp = { path = "crates/v12-interp" }
v12-codegen = { path = "crates/v12-codegen" }
v12-api = { path = "crates/v12-api" }
v12-jit-baseline = { path = "crates/v12-jit-baseline" }
v12-jit-opt = { path = "crates/v12-jit-opt" }
v12-regex = { path = "crates/v12-regex" }
v12-engine = { path = "crates/v12-engine" }
test-support = { path = "crates/test-support" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The test262 runner must survive engine panics: `catch_unwind` in the
# per-test execution path is the harness's isolation mechanism, which
# `panic = "abort"` defeats. Runner builds use this profile instead of
# `release` (`conformance/run.sh`), keeping the abort optimization for
# everything else.
[profile.runner]
inherits = "release"
panic = "unwind"
strip = true
