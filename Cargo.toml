[workspace]
resolver = "3"
members = ["crates/*", "conformance/harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = ""

# Design-boundary guardrails (architecture plan phase A). Engine-core crates
# opt into these via `[lints] workspace = true`; control-path crates may stay
# outside. `unsafe_code` is deny (not forbid) so the two audited sites can keep
# their scoped `#[allow(unsafe_code)]`: the `HostClosure` raw-pointer handle
# (v12-heap/src/function.rs) and the JIT executable-memory layer
# (v12-jit-baseline/src/mmap.rs). The unwrap/expect/panic lints are warn-level
# here: the architecture check (scripts/check-architecture.py) is the gate that
# blocks *new* unwraps in non-test code via its audited-site allowlist.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
# Front end (ADR-1): weekly 0.x releases with breaking changes — pin exact,
# upgrade deliberately.
oxc_parser = "=0.147.0"
oxc_ast = "=0.147.0"
oxc_semantic = "=0.147.0"
oxc_span = "=0.147.0"

# JIT backend (ADR-3).
cranelift-frontend = "0.135"
cranelift-codegen = "0.135"
cranelift-module = "0.135"
cranelift-native = "0.135"
cranelift-jit = "0.135"

# ECMA-262 RegExp engine.
regress = "0.12"

# BigInt.
malachite = "0.11"

# Intl / Temporal.
icu = "2.3"
temporal_rs = "0.2"

# Identifier interning.
lasso = "=0.7.3"

# Arena allocation.
bumpalo = "3.20"

# Enum derive helpers (FromRepr for NativeId / Kind discriminants).
strum = { version = "0.28", features = ["derive"] }

# Hash tables / hashing: FxHashMap/FxHashSet (hashbrown-backed, rustc's
# FxHasher) for the integer-keyed maps in v12-heap.
rustc-hash = "2"

# Inline small-vector storage for `JsObject` descriptor slots
# (`properties` / `property_keys`): zero heap alloc for the common
# small-object case, spills to the heap automatically past the inline cap.
smallvec = "1"

# Benchmarks (dev-only).
criterion = "0.8"

# Internal crates.
v12-bytecode = { path = "crates/v12-bytecode" }
v12-heap = { path = "crates/v12-heap" }
v12-native = { path = "crates/v12-native" }
v12-bccompiler = { path = "crates/v12-bccompiler" }
v12-interp = { path = "crates/v12-interp" }
v12-codegen = { path = "crates/v12-codegen" }
v12-api = { path = "crates/v12-api" }
v12-jit-baseline = { path = "crates/v12-jit-baseline" }
v12-jit-opt = { path = "crates/v12-jit-opt" }
v12-regex = { path = "crates/v12-regex" }
v12-intl = { path = "crates/v12-intl" }
v12-engine = { path = "crates/v12-engine" }
test-support = { path = "crates/test-support" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
