# .github/workflows/ci.yml
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace
      # `jit` is in `default` (crates/v12-engine/Cargo.toml:26), so
      # --all-features is a no-op and the previous comment claiming it
      # "ensures gated tests are not silently skipped" was false. The build
      # that actually needs testing is the interpreter-only one.
      - run: cargo nextest run --workspace --no-default-features

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Phase 1 (Freeze) guard: no new property_keys.push /
      # properties.get(1) / error_value(" sites (builtins-arch-plan §5.1).
      - run: ./scripts/freeze-lint.sh
      # unsafe discipline + clippy, report-only. This script replaced a
      # reference to a script that never existed in any branch, which meant
      # this job died here and clippy never ran at all.
      - run: ./scripts/check-architecture.sh

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Test262
        run: |
          set +e
          # --format tap,json is required together: `--format json --json-out F`
          # alone silently writes nothing.
          ./conformance/run.sh --filter language --jobs 4 \
            --format tap,json --json-out /tmp/t262.json \
            --tap-out /tmp/t262.tap \
            >/tmp/t262.stdout 2>/tmp/t262.stderr
          printf '%s\n' "$?" >/tmp/t262.status
          exit 0
      - name: Upload Test262 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-coverage
          path: |
            /tmp/t262.json
            /tmp/t262.tap
            /tmp/t262.stdout
            /tmp/t262.stderr
            /tmp/t262.status
          if-no-files-found: ignore
      - name: Report pass rate
        if: always()
        run: |
          tail -n 40 /tmp/t262.tap || true
      # THE REGRESSION GATE. Compares fail SETS, not pass rates: a net rise can
      # hide new failures and a net zero can hide a one-for-one swap. Exit 1 on
      # BROKE or REGRESSED; MARGINAL only warns (those are tests sitting near the
      # kill window that flip with load alone).
      #
      # This replaces the old "Propagate Test262 status" step, which exited 1 if
      # ANY test failed. At 77.6 % conformance that could never be green, so the
      # job trained reviewers to ignore a permanently red result.
      #
      # Regenerate the baseline only via scripts/update-conformance-baseline.sh,
      # and only with a faildiff justifying it (BROKE 0, REGRESSED 0).
      - name: Gate on conformance regressions
        run: |
          if [[ ! -s /tmp/t262.json ]]; then
            echo "::error::Test262 produced no JSON report; cannot gate." >&2
            echo "Check conformance/run.sh and the submodule checkout." >&2
            exit 1
          fi
          ./conformance/faildiff.sh \
            conformance/baseline/language.json /tmp/t262.json
