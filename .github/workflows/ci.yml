# .github/workflows/ci.yml
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace
      # JIT is feature-gated on v12-jit-baseline; --all-features (not
      # `--features jit`, which needs a package qualifier in a virtual
      # workspace) ensures gated tests are not silently skipped.
      - run: cargo nextest run --workspace --all-features

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Phase 1 (Freeze) guard: no new property_keys.push /
      # properties.get(1) / error_value(" sites (builtins-arch-plan §5.1).
      - run: ./scripts/freeze-lint.sh
      # Design-boundary guardrails: unsafe/thread_local/String-error/unwrap
      # discipline for the engine-core crates (plan phase A).
      - run: ./scripts/check-architecture.sh
      # Engine-core crates opt into workspace lints (unsafe_code forbid,
      # unwrap/expect/panic deny). --all-features catches the JIT paths.
      - run: cargo clippy --workspace --all-features -- -D warnings

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Test262
        run: |
          set +e
          ./conformance/run.sh --filter language --jobs 4 --format tap --tap-out /tmp/t262.tap \
            >/tmp/t262.stdout 2>/tmp/t262.stderr
          status=$?
          printf '%s\n' "$status" >/tmp/t262.status
          exit 0
      - name: Upload Test262 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-coverage
          path: |
            /tmp/t262.tap
            /tmp/t262.stdout
            /tmp/t262.stderr
            /tmp/t262.status
          if-no-files-found: ignore
      - name: Report pass rate
        if: always()
        run: |
          tail -n 40 /tmp/t262.tap || true
      - name: Propagate Test262 status
        if: always()
        run: |
          if [[ ! -s /tmp/t262.status ]]; then
            echo "Test262 status was not recorded." >&2
            exit 1
          fi
          exit "$(cat /tmp/t262.status)"
